<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExcelSplitter</title>
<style>
  :root {
    --accent: #0067c0;
    --accent-hover: #1975c5;
    --accent-press: #005ba6;
    --accent-light: #cfe4f7;
    --text-primary: #1a1a1a;
    --text-secondary: #5d5d5d;
    --text-tertiary: #8a8a8a;
    --text-accent: #003e92;
    --acrylic: rgba(255, 255, 255, .55);
    --acrylic-strong: rgba(255, 255, 255, .72);
    --stroke: rgba(0, 0, 0, .0578);
    --stroke-strong: rgba(0, 0, 0, .12);
    --radius-card: 8px;
    --radius-ctrl: 4px;
    --shadow-card: 0 2px 4px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    --ok: #0f7b0f;
    --danger: #c42b1c;
    --font: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--text-primary);
    /* Mica 透出时 body 保持透明；回退时用渐变模拟云母 */
    background: transparent;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body.no-mica {
    background:
      radial-gradient(1200px 700px at 15% -10%, #d7e3f4 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #dce8f2 0%, transparent 55%),
      linear-gradient(160deg, #eef2f7 0%, #e8ecf1 45%, #e3e9f0 100%);
  }

  .main {
    height: 100%;
    display: grid; grid-template-columns: 11fr 9fr; gap: 14px;
    padding: 14px 18px 16px;
  }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  .card {
    background: var(--acrylic);
    border: 1px solid var(--stroke);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(30px) saturate(1.4);
    padding: 14px 16px;
  }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-head h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; }
  .card-head h2 .no {
    display: inline-grid; place-items: center;
    width: 20px; height: 20px; margin-right: 8px;
    border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 1;
  }
  .card-head .hint { font-size: 12px; color: var(--text-tertiary); }
  .card-head .pill {
    margin-left: auto; font-size: 12px; font-weight: 600;
    color: var(--text-accent); background: var(--accent-light);
    padding: 3px 10px; border-radius: 12px;
  }
  .card.grow { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ---- 拖放区 ---- */
  .dropzone {
    margin-top: 10px;
    border: 1.5px dashed var(--stroke-strong);
    border-radius: var(--radius-ctrl);
    padding: 12px 10px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12px;
    background: rgba(255,255,255,.35);
    transition: border-color .15s, background .15s, color .15s;
  }
  .dropzone .dz-icon { font-size: 16px; display: block; margin-bottom: 4px; }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--text-accent);
  }

  .row { display: flex; gap: 8px; align-items: center; }
  .input {
    flex: 1; height: 32px; padding: 0 10px; min-width: 0;
    font-family: var(--font); font-size: 13px;
    color: var(--text-primary);
    background: rgba(255,255,255,.7);
    border: 1px solid var(--stroke-strong);
    border-radius: var(--radius-ctrl);
    outline: none; transition: border-color .12s, background .12s;
  }
  .input:focus { background: rgba(255,255,255,.95); border-color: var(--accent); }
  .btn {
    height: 32px; padding: 0 16px;
    font-family: var(--font); font-size: 13px;
    border-radius: var(--radius-ctrl);
    border: 1px solid var(--stroke-strong);
    background: rgba(251, 251, 251, .8);
    color: var(--text-primary); cursor: pointer;
    transition: background .12s; white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,.95); }
  .btn:active { background: rgba(0,0,0,.05); color: var(--text-secondary); }
  .btn.accent { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  .btn.accent:hover { background: var(--accent-hover); }
  .btn.accent:active { background: var(--accent-press); color: rgba(255,255,255,.8); }
  .btn:disabled { opacity: .5; cursor: default; }
  .sel-btn { height: 26px; padding: 0 12px; font-size: 12px; }
  .combo {
    height: 32px; font-family: var(--font); font-size: 13px;
    padding: 0 28px 0 10px;
    border: 1px solid var(--stroke-strong);
    border-radius: var(--radius-ctrl);
    background:
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%235d5d5d" fill="none" stroke-width="1.4"/></svg>')
      no-repeat right 10px center, rgba(255,255,255,.7);
    appearance: none; outline: none; color: var(--text-primary); cursor: pointer;
  }
  .spin {
    height: 32px; width: 60px; text-align: center;
    font-family: var(--font); font-size: 13px;
    border: 1px solid var(--stroke-strong); border-radius: var(--radius-ctrl);
    background: rgba(255,255,255,.7); outline: none; color: var(--text-primary);
  }

  .grid-wrap {
    flex: 1; min-height: 0;
    border: 1px solid var(--stroke-strong);
    border-radius: var(--radius-ctrl);
    overflow-y: auto; background: rgba(255,255,255,.5);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left; font-weight: 600;
    padding: 7px 12px; font-size: 12px;
    background: rgba(243,246,250,.95);
    border-bottom: 1px solid var(--stroke-strong);
    color: var(--text-secondary);
  }
  tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--stroke);
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  tbody tr { cursor: default; transition: background .1s; }
  tbody tr:hover { background: rgba(255,255,255,.7); }
  tbody tr.selected { background: var(--accent-light); }
  tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  td.no { width: 40px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  td.preview { color: var(--text-tertiary); }
  .check {
    width: 16px; height: 16px; border-radius: 3px;
    border: 1px solid var(--text-tertiary);
    display: inline-grid; place-items: center; vertical-align: middle;
    background: #fff;
  }
  tr.selected .check { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 10px; }
  .empty-tip { padding: 32px 12px; text-align: center; color: var(--text-tertiary); font-size: 13px; }

  .split-progress { margin-bottom: 12px; }
  .split-progress .line1 { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .split-progress .pct { font-size: 22px; font-weight: 700; color: var(--text-accent); font-variant-numeric: tabular-nums; }
  .split-progress .cur { font-size: 12px; color: var(--text-secondary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .split-progress .cnt { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
  .progress { height: 6px; border-radius: 3px; background: rgba(0,0,0,.08); overflow: hidden; }
  .progress .fill {
    width: 0%; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #4aa3e8);
    transition: width .25s ease;
  }
  .progress.running .fill { animation: shimmer 2.2s ease-in-out infinite; }
  @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.65} }
  .big-btn { width: 100%; height: 38px; font-size: 14px; }

  .log {
    flex: 1; min-height: 0; overflow-y: auto;
    font-family: Consolas, var(--font); font-size: 12px;
    line-height: 1.9; color: var(--text-secondary);
    user-select: text;
  }
  .log .t { color: var(--text-tertiary); margin-right: 10px; font-variant-numeric: tabular-nums; }
  .log .ok { color: var(--ok); }
  .log .err { color: var(--danger); }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: rgba(30, 34, 40, .92); color: #fff;
    font-size: 13px; padding: 10px 20px; border-radius: 6px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 99;
    max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.3); background-clip: content-box; border: 3px solid transparent; }
</style>
</head>
<body class="no-mica">

<div class="main">

  <!-- ══ 左栏：配置 ══ -->
  <div class="col">

    <section class="card">
      <div class="card-head">
        <h2><span class="no">1</span>选择文件</h2>
        <span class="hint">支持 .xlsx / .xlsm / .xls</span>
      </div>
      <div class="row">
        <input class="input" id="filePath" placeholder="尚未选择文件" readonly>
        <button class="btn" id="btnBrowse">浏览…</button>
        <button class="btn sel-btn" id="btnClearFile" title="清除已载入文件与拆分设置" disabled>清除</button>
      </div>
      <div class="dropzone" id="fileDrop" data-zone="file">
        <span class="dz-icon">⇩</span>
        将 Excel 文件拖到这里
      </div>
    </section>

    <section class="card grow">
      <div class="card-head">
        <h2><span class="no">2</span>拆分设置</h2>
        <span class="hint">点击列名多选 · Shift 范围选</span>
        <span class="pill" id="estPill" style="display:none;"></span>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <span style="font-size:13px; color:var(--text-secondary);">工作表</span>
        <select class="combo" id="sheetCombo" disabled><option>—</option></select>
        <span style="font-size:13px; color:var(--text-secondary); margin-left:8px;">表头行</span>
        <input class="spin" id="headerRow" type="number" value="1" min="1" max="50">
        <div style="margin-left:auto; display:flex; gap:6px;" id="selTools">
          <button class="btn sel-btn" data-sel="all" disabled>全选</button>
          <button class="btn sel-btn" data-sel="invert" disabled>反选</button>
          <button class="btn sel-btn" data-sel="none" disabled>取消选择</button>
        </div>
      </div>
      <div class="grid-wrap" id="gridWrap">
        <div class="empty-tip">选择文件后，这里会列出所有列</div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span class="no">3</span>输出位置</h2>
      </div>
      <div class="row">
        <input class="input" id="outDir" placeholder="默认输出到源文件同名文件夹">
        <button class="btn" id="btnOutBrowse">浏览…</button>
        <button class="btn" id="btnOpenDir">打开目录</button>
      </div>
      <div class="dropzone" id="folderDrop" data-zone="folder">
        <span class="dz-icon">⇩</span>
        将文件夹拖到这里，自动设为输出目录
      </div>
    </section>

  </div>

  <!-- ══ 右栏：执行 + 结果 ══ -->
  <div class="col">

    <section class="card">
      <div class="card-head">
        <h2><span class="no">4</span>开始拆分</h2>
      </div>
      <div class="split-progress">
        <div class="line1">
          <span class="pct" id="pct">—</span>
          <span class="cur" id="curFile">选择文件与拆分列后开始</span>
          <span class="cnt" id="cnt"></span>
        </div>
        <div class="progress" id="progWrap"><div class="fill" id="progFill"></div></div>
      </div>
      <button class="btn accent big-btn" id="btnSplit" disabled>开始拆分</button>
    </section>

    <section class="card grow">
      <div class="card-head">
        <h2><span class="no">5</span>运行日志</h2>
        <span class="hint" id="logHint"></span>
        <button class="btn sel-btn" id="btnClearLog" style="margin-left:auto;" title="清空运行日志" disabled>清空日志</button>
      </div>
      <div class="log" id="log"></div>
    </section>

  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let state = {
  filePath: null,
  sheets: [],
  columns: [],        // [{no, name, preview}]
  selected: new Set(),
  outDir: "",
  busy: false,
};

/* ---------------- 基础 UI ---------------- */
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}
function now() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function log(msg, kind) {
  const box = $("log");
  const div = document.createElement("div");
  if (kind) div.className = kind;
  div.innerHTML = '<span class="t"></span>';
  div.firstChild.textContent = now();
  div.appendChild(document.createTextNode(msg));
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 500) box.removeChild(box.firstChild);
  updateLogTools();
}

/* ---------------- ① 选择文件 ---------------- */
$("btnBrowse").addEventListener("click", async () => {
  if (state.busy) return;
  const r = await pywebview.api.pick_file();
  if (r && r.path) applyFile(r);
});

/* 清除：清空文件选择框 + 拆分设置的列列表 / 工作表(表名) / 表头行，回到初始状态 */
$("btnClearFile").addEventListener("click", () => {
  if (state.busy || !state.filePath) return;
  state.filePath = null;
  state.sheets = [];
  state.columns = [];
  state.selected = new Set();
  $("filePath").value = "";
  const combo = $("sheetCombo");
  combo.innerHTML = '<option>—</option>';
  combo.disabled = true;
  $("headerRow").value = 1;
  $("estPill").style.display = "none";
  $("logHint").textContent = "";
  renderColumns();
  updateSelTools();
  refreshSplitState();
  log("已清除文件与拆分设置");
});

function applyFile(r) {
  state.filePath = r.path;
  state.sheets = r.sheets || [];
  state.columns = r.columns || [];
  state.selected = new Set();
  state.outDir = r.out_dir || state.outDir;
  $("filePath").value = r.path;
  $("outDir").value = state.outDir || "";
  const combo = $("sheetCombo");
  combo.innerHTML = "";
  state.sheets.forEach((s) => {
    const o = document.createElement("option");
    o.textContent = s;
    combo.appendChild(o);
  });
  combo.disabled = state.sheets.length < 2;
  renderColumns();
  log("已载入: " + r.path.split(/[\\/]/).pop() + "（" + (r.rows || 0) + " 行）");
  $("logHint").textContent = r.rows ? r.rows.toLocaleString() + " 行数据" : "";
  refreshSplitState();
}

/* Python 原生 DOM drop 事件按 __hoverZone 路由（见下方拖放区定义） */
window.setOutDir = (p) => {
  state.outDir = p;
  $("outDir").value = p;
};
window.setOutDirFromBackend = (p) => { window.flagDrop(); window.setOutDir(p); };
window.applyFileFromBackend = (r) => { window.flagDrop(); applyFile(r); };

/* 拖放区：只有拖到区域内才触发。Python 原生 DOM drop 优先（可拿真实路径）；
   前端兜底：超时无反馈自动 base64 载入文件 / 提示文件夹改用浏览 */
window.__hoverZone = null;
window.__domOk = false;
window.__dropFeedback = false;
const DROP_TIMEOUT = 1200;
async function zoneDropFallback(f, zone) {
  if (zone === "file") {
    if (!/\.(xlsx|xlsm|xls)$/i.test(f.name)) { toast("仅支持 .xlsx / .xlsm / .xls 文件"); return; }
    toast("正在读取文件…");
    try {
      let r;
      if (f.path) {
        r = await pywebview.api.load_path(f.path);
      } else {
        const buf = await f.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        r = await pywebview.api.load_blob(f.name, btoa(bin));
      }
      if (r && r.error) { toast(r.error); return; }
      if (r && r.path) applyFile(r);
    } catch (err) { toast("读取文件失败：" + err); }
  } else {
    if (f.path) {
      const r = await pywebview.api.set_out_dir(f.path);
      if (r && r.ok) { window.setOutDir(r.path); toast("输出目录已设为 " + r.path); return; }
    }
    toast("未能获取文件夹路径，请用「浏览…」选择文件夹");
  }
}
["fileDrop", "folderDrop"].forEach((id) => {
  const zone = $(id);
  zone.addEventListener("dragenter", (e) => { window.__hoverZone = zone.dataset.zone; });
  zone.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    window.__hoverZone = zone.dataset.zone;
    zone.classList.add("dragover");
  });
  zone.addEventListener("dragleave", () => {
    window.__hoverZone = null;
    zone.classList.remove("dragover");
  });
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    zone.classList.remove("dragover");
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    // 注意：这里不 stopPropagation、也不提前清空 __hoverZone。
    // drop 事件必须继续冒泡到 document，由 pywebview 原生监听取到 __hoverZone
    // 路由，并通过 FilesDropped 机制注入 pywebviewFullPath 真实路径；
    // zone 由后端 _on_dom_drop「消费」式读取后再清空。
    window.__dropFeedback = false;
    // 后端接管时等工作反馈；超时未反馈则前端自愈
    setTimeout(() => {
      if (!window.__dropFeedback) zoneDropFallback(f, zone.dataset.zone);
    }, window.__domOk ? DROP_TIMEOUT : 0);
  });
});
window.flagDrop = () => { window.__dropFeedback = true; };

/* ---------------- ② 拆分设置 ---------------- */
$("sheetCombo").addEventListener("change", reloadColumns);
$("headerRow").addEventListener("change", reloadColumns);

/* 选列工具栏：全选 / 反选 / 取消选择（点击列名本身已是多选切换） */
$("selTools").addEventListener("click", (e) => {
  const b = e.target.closest(".sel-btn");
  if (!b || b.disabled || state.busy || !state.columns.length) return;
  if (b.dataset.sel === "all") selectAll();
  else if (b.dataset.sel === "invert") invertSelect();
  else clearSelect();
});
function updateSelTools() {
  const has = !!state.columns.length;
  ["all", "invert", "none"].forEach((k) => {
    const b = $("selTools").querySelector('.sel-btn[data-sel="' + k + '"]');
    if (b) b.disabled = !has || state.busy;
  });
}
function selectAll() {
  state.selected = new Set(state.columns.map((c) => c.no));
  syncSelection();
}
function invertSelect() {
  state.selected = new Set(state.columns.filter((c) => !state.selected.has(c.no)).map((c) => c.no));
  syncSelection();
}
function clearSelect() {
  state.selected = new Set();
  syncSelection();
}

async function reloadColumns() {
  if (!state.filePath || state.busy) return;
  const r = await pywebview.api.get_columns(state.filePath, $("sheetCombo").value, +$("headerRow").value || 1);
  if (r && r.error) { toast(r.error); return; }
  state.columns = r.columns || [];
  state.selected = new Set();
  $("logHint").textContent = r.rows ? r.rows.toLocaleString() + " 行数据" : "";
  renderColumns();
  refreshSplitState();
}

function renderColumns() {
  const wrap = $("gridWrap");
  wrap.innerHTML = "";
  if (!state.columns.length) {
    wrap.innerHTML = '<div class="empty-tip">选择文件后，这里会列出所有列</div>';
    return;
  }
  const table = document.createElement("table");
  table.innerHTML = "<thead><tr><th style='width:40px;'>#</th><th style='width:30px;'></th><th>列名</th><th>示例值</th></tr></thead>";
  const tbody = document.createElement("tbody");
  state.columns.forEach((c) => {
    const tr = document.createElement("tr");
    tr.dataset.no = c.no;
    tr.innerHTML = "<td class='no'></td><td><span class='check'></span></td><td></td><td class='preview'></td>";
    tr.children[0].textContent = c.no;
    tr.children[2].textContent = c.name;
    tr.children[3].textContent = c.preview;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  let lastIdx = -1;
  tbody.addEventListener("click", (e) => {
    const tr = e.target.closest("tr");
    if (!tr || state.busy) return;
    const idx = state.columns.findIndex((c) => c.no === +tr.dataset.no);
    if (e.shiftKey && lastIdx >= 0) {
      // Shift：自上次点击到当前列的范围选择（不加 Ctrl 则替换当前选择）
      const [a, b] = [Math.min(lastIdx, idx), Math.max(lastIdx, idx)];
      if (!e.ctrlKey) state.selected.clear();
      for (let i = a; i <= b; i++) state.selected.add(state.columns[i].no);
    } else {
      // 默认多选：每勾一个列名就是新增/取消勾选一个，不清空其他
      state.selected.has(+tr.dataset.no) ? state.selected.delete(+tr.dataset.no) : state.selected.add(+tr.dataset.no);
    }
    lastIdx = idx;
    syncSelection();
  });
  syncSelection();
}

function syncSelection() {
  document.querySelectorAll("#gridWrap tbody tr").forEach((tr) => {
    tr.classList.toggle("selected", state.selected.has(+tr.dataset.no));
    tr.querySelector(".check").textContent = state.selected.has(+tr.dataset.no) ? "✓" : "";
  });
  updateSelTools();
  updateEstimate();
}

let estTimer = null;
async function updateEstimate() {
  clearTimeout(estTimer);
  estTimer = setTimeout(async () => {
    const pill = $("estPill");
    if (!state.filePath || !state.selected.size) { pill.style.display = "none"; return; }
    const r = await pywebview.api.estimate(state.filePath, $("sheetCombo").value, +$("headerRow").value || 1, [...state.selected]);
    if (r && typeof r.count === "number") {
      pill.textContent = "预计生成 " + r.count + " 个文件";
      pill.style.display = "";
    }
  }, 120);
}

/* ---------------- ③ 输出位置 ---------------- */
$("btnOutBrowse").addEventListener("click", async () => {
  if (state.busy) return;
  const d = await pywebview.api.pick_out_dir($("outDir").value);
  if (d) { state.outDir = d; $("outDir").value = d; }
});
$("btnOpenDir").addEventListener("click", () => pywebview.api.open_dir($("outDir").value));

/* ---------------- ④ 开始拆分 ---------------- */
$("btnSplit").addEventListener("click", async () => {
  if (state.busy || !state.filePath) return;
  if (!state.selected.size) { toast("请先选择至少一个拆分列"); return; }
  state.busy = true;
  $("btnSplit").disabled = true;
  $("log").innerHTML = "";
  $("progWrap").classList.add("running");
  pywebview.api.split(state.filePath, $("sheetCombo").value, +$("headerRow").value || 1, [...state.selected], $("outDir").value);
});
function refreshSplitState() {
  $("btnSplit").disabled = state.busy || !state.filePath;
  $("btnClearFile").disabled = state.busy || !state.filePath;
}

/* Python -> JS 事件 */
window.onProgress = (i, t, name) => {
  $("pct").textContent = Math.round(i / t * 100) + "%";
  $("curFile").textContent = "正在生成：" + name;
  $("cnt").textContent = i + " / " + t + " 个文件";
  $("progFill").style.width = (i / t * 100) + "%";
};
window.onLog = (msg, kind) => log(msg, kind);
window.onReady = (domOk, micaOk) => {
  window.__domOk = !!domOk;
  // 真 Mica 已开启：body 保持透明让云母透出；否则启用 CSS 模拟
  document.body.classList.toggle("no-mica", !micaOk);
};
window.onDone = (r) => {
  state.busy = false;
  refreshSplitState();
  $("progWrap").classList.remove("running");
  $("progFill").style.width = "100%";
  $("pct").textContent = "100%";
  $("curFile").textContent = r.errors ? "完成，部分文件失败" : "拆分完成";
  $("cnt").textContent = "成功 " + r.created + " 个" + (r.errors ? "，失败 " + r.errors.length + " 个" : "");
  if (r.out_dir) { state.outDir = r.out_dir; $("outDir").value = r.out_dir; }
  log("输出位置: " + r.out_dir, "ok");
  if (r.errors) r.errors.forEach((e) => log("失败 " + e[0] + " -> " + e[1], "err"));
  toast("拆分完成！成功生成 " + r.created + " 个文件");
};
window.onError = (msg) => {
  state.busy = false;
  refreshSplitState();
  $("progWrap").classList.remove("running");
  log("出错：" + msg, "err");
  toast("出错：" + msg);
};

/* ---------------- 运行日志工具栏 ---------------- */
$("btnClearLog").addEventListener("click", () => {
  if (state.busy) return;
  $("log").innerHTML = "";
  updateLogTools();
});
function updateLogTools() {
  const b = $("btnClearLog");
  if (b) b.disabled = state.busy || !$("log").children.length;
}

/* ---------------- 初始化 ---------------- */
window.addEventListener("pywebviewready", async () => {
  const s = await pywebview.api.get_settings();
  if (s && s.out_dir) { state.outDir = s.out_dir; $("outDir").value = s.out_dir; }
  log("就绪 · 选择 Excel 文件开始");
});
</script>
</body>
