name: Build and Release

# 推送形如 v* 的 tag（如 v1.0.0）时自动触发：
# 在云端 Windows 上打包 exe，并创建 GitHub Release 附带该 exe。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 允许 action-gh-release 创建 release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl xlrd pyinstaller pywebview

      - name: 用 PyInstaller 打包 exe
        run: |
          pyinstaller --onefile --windowed --name ExcelSplitter --noupx --manifest dpi_manifest.xml --clean --icon assets/icons/ExcelSplitter.ico --hidden-import xlrd --collect-all webview --add-data "webgui;webgui" excel_splitter.py

      - name: 重命名 exe 带上版本号
        run: |
          $exe = "dist/ExcelSplitter-" + $env:GITHUB_REF_NAME + ".exe"
          Move-Item dist/ExcelSplitter.exe $exe

      - name: 从 CHANGELOG 提取本版本说明
        run: |
          $tag = $env:GITHUB_REF_NAME                     # 形如 v2.1.0
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -SimpleMatch "## [$tag]").LineNumber
          if (-not $start) { throw "CHANGELOG.md 中找不到 ## [$tag] 段落，请先更新 CHANGELOG 再打 tag" }
          $end = ($lines | Select-String -Pattern '^## \[' |
                  Where-Object { $_.LineNumber -gt $start } |
                  Select-Object -First 1).LineNumber
          if (-not $end) { $end = $lines.Count + 1 }
          $notes = $lines[($start)..($end-2)] -join "`r`n"   # 跳过 "## [版本]" 标题行
          Set-Content -Path release_notes.md -Value $notes -Encoding UTF8

      - name: 创建 Release 并上传 exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ExcelSplitter ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/ExcelSplitter-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
