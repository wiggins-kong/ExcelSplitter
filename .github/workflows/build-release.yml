name: Build and Release

# 推送形如 v* 的 tag（如 v1.0.0）时自动触发：
# 在云端 Windows 上打包 exe，并创建 GitHub Release 附带该 exe。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 允许 action-gh-release 创建 release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: 用 PyInstaller 打包 exe
        run: |
          pyinstaller --onefile --windowed --name ExcelSplitter --noupx --manifest dpi_manifest.xml excel_splitter.py

      - name: 创建 Release 并上传 exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ExcelSplitter ${{ github.ref_name }}
          body: |
            自动构建版本 ${{ github.ref_name }}。

            ## 使用
            下载下方的 `ExcelSplitter.exe`，双击即可运行（无需安装 Python）。
            详见仓库 README。
          files: dist/ExcelSplitter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
