name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:        # 手动触发：Actions 页面点「Run workflow」填 tag 名即可，无需删 release
    inputs:
      tag:
        description: '要同步到 Gitee 的 tag 名，例如 v1.0.2'
        required: true

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: 确定要同步的 tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Push tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/wiggins-kong/ExcelSplitter.git
          git push gitee tag ${{ steps.tag.outputs.tag }}

      - name: 下载 GitHub Release 附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.tag.outputs.tag }}" --dir dist --clobber
          ls -la dist

      - name: Create Gitee release and upload assets
        uses: actions/github-script@v7
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tagName = '${{ steps.tag.outputs.tag }}';

            const giteeOwner = 'wiggins-kong';
            const giteeRepo = 'ExcelSplitter';   // Gitee 仓库名，已与 GitHub 统一
            const GITEE_TOKEN = process.env.GITEE_TOKEN;
            const repo = context.repo;

            let rel;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner: repo.owner, repo: repo.repo, tag: tagName });
              rel = data;
            } catch {
              rel = { tag_name: tagName, name: tagName, body: '', prerelease: false };
            }

            async function getGiteeReleaseByTag(tag) {
              const r = await fetch(
                `https://gitee.com/api/v5/repos/${giteeOwner}/${giteeRepo}/releases/tags/${tag}?access_token=${GITEE_TOKEN}`);
              return r.ok ? r.json() : null;
            }

            let giteeRel = await getGiteeReleaseByTag(tagName);
            if (!giteeRel) {
              const createResp = await fetch(
                `https://gitee.com/api/v5/repos/${giteeOwner}/${giteeRepo}/releases?access_token=${GITEE_TOKEN}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    tag_name: rel.tag_name,
                    name: rel.name || rel.tag_name,
                    body: rel.body || '',
                    prerelease: rel.prerelease,
                    target_commitish: rel.target_commitish || 'main',
                  }),
                });
              const createJson = await createResp.json();
              if (!createResp.ok) {
                throw new Error('创建 Gitee Release 失败: ' + JSON.stringify(createJson));
              }
              giteeRel = createJson;
            }
            const giteeReleaseId = giteeRel.id;
            console.log('Gitee release id:', giteeReleaseId);

            // 附件已由 gh CLI 下载到 dist/，这里直接读文件上传 Gitee
            const distDir = path.join(process.env.GITHUB_WORKSPACE || '.', 'dist');
            let files = [];
            try {
              files = fs.readdirSync(distDir).filter(f => fs.statSync(path.join(distDir, f)).isFile());
            } catch (e) {
              console.log('dist 目录读取失败:', e.message);
            }
            console.log('待上传附件:', files.join(', ') || '(无)');
            for (const f of files) {
              try {
                const buf = fs.readFileSync(path.join(distDir, f));
                const form = new FormData();
                form.append('access_token', GITEE_TOKEN);
                form.append('attach_files', new Blob([buf]), f);
                const up = await fetch(
                  `https://gitee.com/api/v5/repos/${giteeOwner}/${giteeRepo}/releases/${giteeReleaseId}/attach_files`, {
                    method: 'POST',
                    body: form,
                  });
                const upJson = await up.json();
                if (!up.ok) {
                  console.log(`附件 ${f} 上传失败: ${JSON.stringify(upJson)}`);
                } else {
                  console.log(`附件 ${f} 已上传 (${buf.length} 字节)`);
                }
              } catch (err) {
                console.log(`附件 ${f} 上传异常: ${err.message}`);
              }
            }